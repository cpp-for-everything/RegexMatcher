name: Route matcher

# The route matcher (include/matcher/route.hpp) and its tests: behaviour, compile-time tables at
# the sizes of the route-matching benchmark (paper-typed-routing), and negative compilation.
# The regex engine keeps ci.yaml.
# The first run sets the supported compilers; one that fails goes into the README with its
# error. The C compiler is set too: GoogleTest's project enables C, and on Windows CMake would
# otherwise pick clang.exe (GNU-style driver) and hand it MSVC flags.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, cc: clang, cxx: clang++, name: linux-clang}
          - {os: ubuntu-24.04, cc: gcc-14, cxx: g++-14, name: linux-gcc}
          # windows-2022 has MSVC 19.44, which stops with internal compiler error C1001 while
          # compiling the compile-time-table tests (include/matcher/route/table.hpp, line 502, in
          # test_github.cpp). MSVC 19.51 builds and passes them. This lane builds and runs every
          # other route test.
          - {os: windows-2022, cc: cl, cxx: cl, name: windows-msvc,
             targets: route_tests route_checked_tests, exclude: RouteCtTables}
          - {os: windows-2022, cc: clang-cl, cxx: clang-cl, name: windows-clang-cl}
          - {os: macos-15, cc: clang, cxx: clang++, name: macos-appleclang}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - name: Ninja
        if: runner.os != 'Linux'
        run: ${{ runner.os == 'Windows' && 'choco install ninja -y' || 'brew install ninja' }}
      - name: Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build (the compile-time-table tests one at a time)
        run: cmake --build build --target ${{ matrix.targets || 'route_tests route_checked_tests route_ct_table_tests' }}
      - name: Test
        shell: bash
        env:
          EXCLUDE: ${{ matrix.exclude }}
        run: ctest --test-dir build --output-on-failure -R "Route|route_neg" ${EXCLUDE:+-E "$EXCLUDE"}

  sanitize:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address+undefined, thread]
    runs-on: ubuntu-24.04
    name: linux-clang-${{ matrix.sanitizer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++ -DREGEXMATCHER_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build --target route_tests route_checked_tests route_ct_table_tests
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure -R "Route|route_neg"
